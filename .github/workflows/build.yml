name: Build plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyVote/Jellyfin.Plugin.JellyVote.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "1.0.0.0" }
          if ($version -notmatch '\.') { $version = "$version.0.0" }
          New-Item -ItemType Directory -Force -Path dist/JellyVote | Out-Null
          Copy-Item Jellyfin.Plugin.JellyVote/bin/Release/net9.0/Jellyfin.Plugin.JellyVote.dll dist/JellyVote/
          $meta = Get-Content build/meta.json -Raw | ConvertFrom-Json
          $meta.version = $version
          $meta.timestamp = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $meta | ConvertTo-Json -Depth 5 | Set-Content dist/JellyVote/meta.json
          Compress-Archive -Path dist/JellyVote/* -DestinationPath "dist/Jellyfin.Plugin.JellyVote_$version.zip" -Force
          $hash = (Get-FileHash "dist/Jellyfin.Plugin.JellyVote_$version.zip" -Algorithm MD5).Hash
          echo "PLUGIN_VERSION=$version" >> $env:GITHUB_ENV
          echo "PLUGIN_CHECKSUM=$hash" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyvote-plugin
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
