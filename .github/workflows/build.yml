name: Build plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g. 1.0.1.0). Ignored on tag pushes."
        required: false
        default: "0.0.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag/ref
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "$VERSION" || "$VERSION" == "0.0.0.0" ]]; then
            VERSION="1.0.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyVote/Jellyfin.Plugin.JellyVote.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $version = $env:PLUGIN_VERSION
          New-Item -ItemType Directory -Force -Path dist/JellyVote | Out-Null
          Copy-Item Jellyfin.Plugin.JellyVote/bin/Release/net9.0/Jellyfin.Plugin.JellyVote.dll dist/JellyVote/
          if (Test-Path build/thumb.png) {
            Copy-Item build/thumb.png dist/JellyVote/thumb.png -Force
          }
          $meta = Get-Content build/meta.json -Raw | ConvertFrom-Json
          $meta.version = $version
          $meta.timestamp = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $meta.imagePath = "thumb.png"
          $metaJson = $meta | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$pwd/dist/JellyVote/meta.json", $metaJson + "`n", [System.Text.UTF8Encoding]::new($false))
          Compress-Archive -Path dist/JellyVote/* -DestinationPath "dist/Jellyfin.Plugin.JellyVote_$version.zip" -Force
          $hash = (Get-FileHash "dist/Jellyfin.Plugin.JellyVote_$version.zip" -Algorithm MD5).Hash.ToUpperInvariant()
          echo "PLUGIN_CHECKSUM=$hash" >> $env:GITHUB_ENV
          echo "checksum=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "MD5 $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyvote-plugin
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:PLUGIN_VERSION
          $hash = $env:PLUGIN_CHECKSUM
          git fetch origin main
          git checkout -B main origin/main
          ./scripts/update-manifest.ps1 `
            -Version $version `
            -Checksum $hash `
            -Repository $env:GITHUB_REPOSITORY `
            -Changelog "Release $version - see https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if (git diff --staged --quiet) {
            Write-Host "manifest.json already up to date"
          } else {
            git commit -m "chore: update manifest checksum for v$version"
            git push origin main
          }
